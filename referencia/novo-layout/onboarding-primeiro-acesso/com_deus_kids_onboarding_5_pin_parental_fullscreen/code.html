<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport"><meta content="web_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = {

        "colors": {

          "on-primary": "#ffffff",
          "primary-fixed": "#ffdbd0",
          "on-primary-fixed": "#390c00",
          "secondary": "#006c49",
          "secondary-container": "#6cf8bb",
          "on-secondary": "#ffffff",
          "background": "#f8f9ff",
          "surface": "#f8f9ff",
          "surface-container-lowest": "#ffffff",
          "surface-container-low": "#f0f4fd",
          "surface-container": "#eaeef8",
          "surface-container-high": "#e4e8f2",
          "surface-container-highest": "#dee2ec",
          "outline": "#8d7168",
          "outline-variant": "#e1bfb5",
          "on-surface": "#171c23",
          "on-surface-variant": "#594139",
          "error": "#ba1a1a"
        },
        "fontFamily": {
          "display": ["Plus Jakarta Sans"],
          "headline-xl": ["Plus Jakarta Sans"],
          "headline-lg": ["Plus Jakarta Sans"],
          "headline-md": ["Plus Jakarta Sans"],
          "body-lg": ["Plus Jakarta Sans"],
          "body-md": ["Plus Jakarta Sans"],
          "label-md": ["Plus Jakarta Sans"],
          "label-sm": ["Plus Jakarta Sans"],
          "caption": ["Plus Jakarta Sans"]
        }
      }
    }
  }</script></head><body class="bg-background font-body-md text-on-surface antialiased min-h-screen h-screen w-screen overflow-hidden flex flex-col justify-between selection:bg-primary-container selection:text-white">
<!-- Glows de Fundo Atmosféricos e Sutis -->
<div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
<div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-gradient-to-b from-primary-fixed/25 to-transparent rounded-full blur-3xl"></div>
<div class="absolute bottom-0 right-1/4 w-[450px] h-[450px] bg-secondary-container/15 rounded-full blur-3xl"></div>
</div>
<!-- TOPO: Header Minimalista com Logo Sutil e Indicador de Progresso -->

<!-- CONTEÚDO CENTRALIZADO ULTRA CLEAN -->
<main class="flex-1 flex flex-col items-center justify-center px-4 sm:px-8 w-full max-w-3xl mx-auto">
<!-- Ícone Grande e Moderno de Cadeado -->
<div class="relative mb-6">
<div class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-gradient-to-br from-primary-fixed/60 via-surface-container-low to-secondary-container/30 flex items-center justify-center border border-white shadow-lg shadow-primary/10">
<span class="material-symbols-outlined text-5xl sm:text-6xl text-primary-container" style="font-variation-settings: 'FILL' 1;">
          lock
        </span>
</div>
<div class="absolute -bottom-1 -right-1 w-9 h-9 rounded-2xl bg-secondary text-white flex items-center justify-center shadow-md ring-4 ring-background">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
</div>
<!-- Título e Subtítulo Diretos -->
<div class="text-center max-w-md mb-8 sm:mb-10">
<h1 class="font-headline-xl text-3xl sm:text-4xl font-extrabold text-on-surface tracking-tight mb-2">
        Crie seu PIN parental 🔒
      </h1>
<p class="font-body-lg text-base sm:text-lg text-on-surface-variant/90">
        Só os responsáveis poderão acessar as configurações.
      </p>
</div>
<!-- Grupos de PIN em Caixas Grandes e Elegantes -->
<div class="w-full max-w-lg flex flex-col items-center gap-7">
<!-- Digite o PIN -->
<div class="flex flex-col items-center gap-2.5 w-full">
<span class="text-xs font-bold uppercase tracking-widest text-outline">Digite o PIN (4 dígitos)</span>
<div class="flex items-center justify-center gap-3 sm:gap-4.5">
<input autofocus="" class="pin-digit-1 w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-extrabold bg-surface-container-lowest text-on-surface rounded-2xl border-2 border-surface-container hover:border-outline-variant focus:border-primary-container focus:ring-4 focus:ring-primary-container/15 focus:outline-none transition-all duration-200 shadow-sm caret-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<input class="pin-digit-1 w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-extrabold bg-surface-container-lowest text-on-surface rounded-2xl border-2 border-surface-container hover:border-outline-variant focus:border-primary-container focus:ring-4 focus:ring-primary-container/15 focus:outline-none transition-all duration-200 shadow-sm caret-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<input class="pin-digit-1 w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-extrabold bg-surface-container-lowest text-on-surface rounded-2xl border-2 border-surface-container hover:border-outline-variant focus:border-primary-container focus:ring-4 focus:ring-primary-container/15 focus:outline-none transition-all duration-200 shadow-sm caret-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<input class="pin-digit-1 w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-extrabold bg-surface-container-lowest text-on-surface rounded-2xl border-2 border-surface-container hover:border-outline-variant focus:border-primary-container focus:ring-4 focus:ring-primary-container/15 focus:outline-none transition-all duration-200 shadow-sm caret-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
</div>
</div>
<!-- Confirme o PIN -->
<div class="flex flex-col items-center gap-2.5 w-full">
<div class="flex items-center gap-1.5">
<span class="text-xs font-bold uppercase tracking-widest text-outline">Confirme seu PIN</span>
<span class="material-symbols-outlined text-sm text-secondary opacity-0 transition-opacity" id="match-indicator">check_circle</span>
</div>
<div class="flex items-center justify-center gap-3 sm:gap-4.5">
<input class="pin-digit-2 w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-extrabold bg-surface-container-lowest text-on-surface rounded-2xl border-2 border-surface-container hover:border-outline-variant focus:border-primary-container focus:ring-4 focus:ring-primary-container/15 focus:outline-none transition-all duration-200 shadow-sm caret-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<input class="pin-digit-2 w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-extrabold bg-surface-container-lowest text-on-surface rounded-2xl border-2 border-surface-container hover:border-outline-variant focus:border-primary-container focus:ring-4 focus:ring-primary-container/15 focus:outline-none transition-all duration-200 shadow-sm caret-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<input class="pin-digit-2 w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-extrabold bg-surface-container-lowest text-on-surface rounded-2xl border-2 border-surface-container hover:border-outline-variant focus:border-primary-container focus:ring-4 focus:ring-primary-container/15 focus:outline-none transition-all duration-200 shadow-sm caret-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
<input class="pin-digit-2 w-14 h-16 sm:w-16 sm:h-20 text-center text-3xl font-extrabold bg-surface-container-lowest text-on-surface rounded-2xl border-2 border-surface-container hover:border-outline-variant focus:border-primary-container focus:ring-4 focus:ring-primary-container/15 focus:outline-none transition-all duration-200 shadow-sm caret-transparent" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="password">
</div>
</div>
<!-- Feedback Dinâmico Sutil -->
<div class="h-6 flex items-center justify-center">
<p class="hidden items-center gap-1.5 text-xs font-semibold text-error" id="pin-feedback">
<span class="material-symbols-outlined text-sm">error</span>
<span id="pin-feedback-text" class="">Os PINs não coincidem. Tente novamente.</span>
</p>
</div>
</div>
</main>
<!-- RODAPÉ: Barra Inferior com Voltar e Criar PIN -->
<footer class="w-full max-w-6xl mx-auto px-6 sm:px-10 py-6 sm:py-8 flex items-center justify-between border-t border-surface-container/60 shrink-0">
<a class="inline-flex items-center gap-2 px-5 py-3 rounded-2xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low font-semibold text-sm transition-all" href="#">
<span class="material-symbols-outlined text-lg">arrow_back</span>
<span class="">Voltar</span>
</a>
<button class="inline-flex items-center justify-center gap-2 px-8 py-3.5 sm:px-10 sm:py-4 rounded-2xl bg-primary-container hover:bg-primary-container/90 active:scale-[0.98] text-white font-bold text-base sm:text-lg shadow-lg shadow-primary-container/25 hover:shadow-xl hover:shadow-primary-container/30 transition-all cursor-pointer" id="btn-submit" type="button">
<span class="">Criar PIN</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</footer>
<!-- Script Interativo para Auto-Avanço e Validação -->
<script>
    (function() {
      function setupPinGroup(className, nextGroupClass) {
        const inputs = Array.from(document.querySelectorAll('.' + className));
        inputs.forEach((input, idx) => {
          input.addEventListener('input', (e) => {
            const val = e.target.value.replace(/[^0-9]/g, '');
            e.target.value = val;
            if (val) {
              if (idx < inputs.length - 1) {
                inputs[idx + 1].focus();
              } else if (nextGroupClass) {
                const nextInputs = document.querySelectorAll('.' + nextGroupClass);
                if (nextInputs.length > 0) nextInputs[0].focus();
              }
            }
            validateMatch();
          });

          input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && idx > 0) {
              inputs[idx - 1].focus();
            }
          });
        });
      }

      setupPinGroup('pin-digit-1', 'pin-digit-2');
      setupPinGroup('pin-digit-2', null);

      function getPin(className) {
        return Array.from(document.querySelectorAll('.' + className)).map(i => i.value).join('');
      }

      function validateMatch() {
        const p1 = getPin('pin-digit-1');
        const p2 = getPin('pin-digit-2');
        const indicator = document.getElementById('match-indicator');
        const feedback = document.getElementById('pin-feedback');

        if (p1.length === 4 && p2.length === 4) {
          if (p1 === p2) {
            indicator.classList.remove('opacity-0');
            feedback.classList.add('hidden');
            feedback.classList.remove('flex');
          } else {
            indicator.classList.add('opacity-0');
            feedback.classList.remove('hidden');
            feedback.classList.add('flex');
          }
        } else {
          indicator.classList.add('opacity-0');
          feedback.classList.add('hidden');
          feedback.classList.remove('flex');
        }
      }

      const btn = document.getElementById('btn-submit');
      btn.addEventListener('click', () => {
        const p1 = getPin('pin-digit-1');
        const p2 = getPin('pin-digit-2');
        const feedback = document.getElementById('pin-feedback');
        const feedbackText = document.getElementById('pin-feedback-text');

        if (p1.length < 4 || p2.length < 4) {
          feedbackText.textContent = 'Por favor, digite os 4 dígitos nos dois campos.';
          feedback.classList.remove('hidden');
          feedback.classList.add('flex');
          return;
        }

        if (p1 !== p2) {
          feedbackText.textContent = 'Os PINs inseridos não coincidem. Tente novamente.';
          feedback.classList.remove('hidden');
          feedback.classList.add('flex');
          return;
        }

        btn.innerHTML = '<span class="material-symbols-outlined text-xl animate-spin">sync</span><span>Salvando PIN...</span>';
        btn.classList.add('opacity-80', 'pointer-events-none');
        setTimeout(() => {
          btn.innerHTML = '<span class="material-symbols-outlined text-xl">check</span><span>PIN Criado! Pronto!</span>';
          btn.classList.replace('bg-primary-container', 'bg-secondary');
        }, 700);
      });
    })();
  </script>


</body></html>
