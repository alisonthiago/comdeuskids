<body class="bg-background text-on-surface font-sans min-h-screen flex flex-col justify-between selection:bg-primary/10 selection:text-primary">
<!-- TOP HEADER: Clean logo & discrete progress (Passo 4 de 5 ativo) -->

<!-- MAIN CONTENT: Direct, Ultra Clean, Large & Airy Elements -->
<main class="w-full flex-1 max-w-4xl mx-auto px-6 sm:px-10 py-10 sm:py-14 flex flex-col justify-center">
<!-- Title & Subtitle Direct Block -->
<div class="text-center sm:text-left mb-10">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-primary-fixed text-on-primary-fixed-variant text-xs font-bold tracking-wide uppercase mb-3">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">group</span>
        Rede de Cuidado
      </div>
<h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-on-surface leading-tight">
        Quem cuida com você?
      </h1>
<p class="text-lg sm:text-xl text-on-surface-variant mt-2 font-normal">
        Você pode adicionar outro responsável.
      </p>
</div>
<!-- Guardians Airy Stack -->
<div class="flex flex-col gap-5 w-full">
<!-- 1. Alison (Pai • Titular) - Big Airy Card -->
<div class="w-full bg-surface-container-lowest border border-surface-container rounded-3xl p-6 sm:p-7 flex flex-col sm:flex-row sm:items-center justify-between gap-5 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.04)] hover:border-outline-variant/60 transition-all">
<div class="flex items-center gap-5">
<!-- Avatar Alison -->
<div class="relative flex-shrink-0">
<div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-surface-container-high text-primary flex items-center justify-center font-bold text-2xl sm:text-3xl ring-4 ring-surface-container-lowest shadow-sm">
<span class="text-3xl sm:text-4xl">👨</span>
</div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-secondary text-white flex items-center justify-center shadow-sm" title="Titular Confirmado">
<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Info -->
<div class="flex flex-col">
<div class="flex items-center gap-2.5 flex-wrap">
<span class="text-xl sm:text-2xl font-bold text-on-surface">Alison</span>
<span class="inline-flex items-center px-3 py-0.5 rounded-full text-xs font-bold bg-surface-container text-on-surface-variant">
                Pai • Titular
              </span>
</div>
<span class="text-sm sm:text-base text-outline mt-0.5 font-medium">alison@exemplo.com.br</span>
</div>
</div>
<div class="flex items-center gap-2 self-end sm:self-center">
<span class="px-3.5 py-1.5 rounded-xl bg-surface-container-low text-secondary text-xs sm:text-sm font-semibold flex items-center gap-1.5">
<span class="material-symbols-outlined text-base" style="font-variation-settings: 'FILL' 1;">shield_person</span>
            Conta Principal
          </span>
</div>
</div>
<!-- 2. Nádia (Mãe) - Big Inviting Card with Direct Bond Selection -->
<div class="w-full bg-surface-container-lowest border-2 border-primary-container/40 rounded-3xl p-6 sm:p-7 shadow-[0_8px_30px_-6px_rgba(255,107,53,0.12)] flex flex-col gap-6 relative transition-all">
<div class="flex flex-col sm:flex-row sm:items-start justify-between gap-5">
<div class="flex items-start sm:items-center gap-5">
<!-- Large Elegant Avatar for Nádia -->
<div class="relative flex-shrink-0">
<img alt="Foto de Nádia" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover ring-4 ring-primary-fixed/40 shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDnOvN6wSszASIh5KEuQwIbpTynj-w38y212dlspJS9hP1vXaq-glu033ZnKKtve3W10qS-Z69Cak8LNjBRlgAxFd_QEFerQv-RyjiY28T3JcCQ6swZLbEigOlvuKkY-XnZY4qXj3e7HamCbB4NRQvGg5RAcE7ArOZtcttQHxryocDSXCnJCzSYCSPwudRg5RdDHh4B2xysx_CUlbgb969BL6vXrOI0OB_xFtxkEdjksKV01o3QNkxmkg">
<span class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-secondary-fixed text-on-secondary-fixed-variant flex items-center justify-center shadow-xs">
<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' 1;">favorite</span>
</span>
</div>
<!-- Name and Email input/display -->
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-2 flex-wrap">
<span class="text-xl sm:text-2xl font-bold text-on-surface">Nádia</span>
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-primary-fixed text-on-primary-fixed-variant">
                  👩 Convidada
                </span>
</div>
<p class="text-sm sm:text-base text-on-surface-variant font-medium mt-0.5">nadia.alencar@exemplo.com.br</p>
</div>
</div>
<!-- Actions -->
<div class="flex items-center gap-2 self-end sm:self-center">
<button aria-label="Remover Nádia" class="p-2.5 rounded-xl hover:bg-error-container/50 text-outline hover:text-error transition-colors" title="Remover responsável" type="button">
<span class="material-symbols-outlined text-xl">delete_outline</span>
</button>
</div>
</div>
<!-- Relationship Options (Vínculos Claros) -->
<div class="border-t border-surface-container pt-5 flex flex-col gap-2.5">
<label class="text-xs font-bold uppercase tracking-wider text-outline">Vínculo familiar com as crianças</label>
<div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
<!-- Mãe (Selected) -->
<label class="flex items-center justify-center gap-2 p-3 rounded-2xl border-2 border-primary bg-primary/5 text-primary font-bold text-sm cursor-pointer shadow-xs transition-all">
<input checked="" class="sr-only" name="vinculo_nadia" type="radio" value="mae">
<span class="">👩 Mãe</span>
</label>
<!-- Pai -->
<label class="flex items-center justify-center gap-2 p-3 rounded-2xl border border-surface-container bg-surface-container-low hover:bg-surface-container-lowest text-on-surface font-semibold text-sm cursor-pointer transition-all">
<input class="sr-only" name="vinculo_nadia" type="radio" value="pai">
<span class="">👨 Pai</span>
</label>
<!-- Responsável -->
<label class="flex items-center justify-center gap-2 p-3 rounded-2xl border border-surface-container bg-surface-container-low hover:bg-surface-container-lowest text-on-surface font-semibold text-sm cursor-pointer transition-all">
<input class="sr-only" name="vinculo_nadia" type="radio" value="responsavel">
<span class="">🤝 Responsável</span>
</label>
<!-- Avó / Avô -->
<label class="flex items-center justify-center gap-2 p-3 rounded-2xl border border-surface-container bg-surface-container-low hover:bg-surface-container-lowest text-on-surface font-semibold text-sm cursor-pointer transition-all">
<input class="sr-only" name="vinculo_nadia" type="radio" value="avo">
<span class="">👵 Avó / Avô</span>
</label>
<!-- Outro -->
<label class="col-span-2 sm:col-span-1 flex items-center justify-center gap-2 p-3 rounded-2xl border border-surface-container bg-surface-container-low hover:bg-surface-container-lowest text-on-surface font-semibold text-sm cursor-pointer transition-all">
<input class="sr-only" name="vinculo_nadia" type="radio" value="outro">
<span class="">✨ Outro</span>
</label>
</div>
</div>
</div>
<!-- Botão Sutil e Elegante: + Adicionar outro responsável -->
<button class="w-full py-4 px-6 rounded-2xl border-2 border-dashed border-outline-variant hover:border-primary-container bg-surface-container-lowest/50 hover:bg-surface-container-lowest text-on-surface-variant hover:text-primary font-semibold text-base flex items-center justify-center gap-2.5 transition-all group" type="button">
<span class="w-8 h-8 rounded-full bg-surface-container group-hover:bg-primary-container group-hover:text-white flex items-center justify-center text-primary transition-colors text-lg font-bold">
          ＋
        </span>
<span class="">Adicionar outro responsável</span>
</button>
<!-- Escape Option: Fazer isso depois ou Pular esta etapa -->
<div class="text-center pt-2">
<a class="inline-flex items-center text-sm font-semibold text-outline hover:text-on-surface hover:underline transition-colors py-1" href="#">
          Fazer isso depois ou pular esta etapa
        </a>
</div>
</div>
</main>
<!-- FULLSCREEN FOOTER: Clean Sticky Actions -->
<footer class="w-full border-t border-surface-container bg-surface-container-lowest/90 backdrop-blur-md py-5">
<div class="max-w-4xl mx-auto px-6 sm:px-10 flex items-center justify-between gap-4">
<!-- Botão Voltar à Esquerda -->
<button class="inline-flex items-center gap-2 px-5 py-3 rounded-xl hover:bg-surface-container text-on-surface font-semibold text-base transition-colors" type="button">
<span class="material-symbols-outlined text-xl">arrow_back</span>
<span class="">Voltar</span>
</button>
<!-- Botão Primário Continuar à Direita -->
<button class="inline-flex items-center justify-center gap-2.5 px-8 sm:px-10 py-3.5 rounded-2xl bg-primary hover:bg-primary-container text-white font-bold text-base sm:text-lg shadow-md hover:shadow-lg transition-all transform active:scale-[0.98]" type="button">
<span class="">Continuar</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</footer>
<script>
    // Radio interaction styling helper
    const radioLabels = document.querySelectorAll('input[name="vinculo_nadia"]');
    radioLabels.forEach(radio => {
      radio.addEventListener('change', () => {
        radioLabels.forEach(r => {
          const parent = r.closest('label');
          if (r.checked) {
            parent.className = "flex items-center justify-center gap-2 p-3 rounded-2xl border-2 border-primary bg-primary/5 text-primary font-bold text-sm cursor-pointer shadow-xs transition-all";
          } else {
            parent.className = "flex items-center justify-center gap-2 p-3 rounded-2xl border border-surface-container bg-surface-container-low hover:bg-surface-container-lowest text-on-surface font-semibold text-sm cursor-pointer transition-all";
          }
        });
      });
    });
  </script>


</body></html>
