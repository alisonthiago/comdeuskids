<script>
    function toggleAddForm() {
      const modal = document.getElementById('add-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('modal-name').focus();
        modal.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function calculateModalAge(birthDateStr) {
      const badge = document.getElementById('modal-calc-age');
      if (!birthDateStr) {
        badge.innerHTML = '<span class="material-symbols-outlined text-xs">cake</span> Informar';
        return;
      }
      const today = new Date();
      const birth = new Date(birthDateStr);
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
        age--;
      }
      badge.innerHTML = `<span class="material-symbols-outlined text-xs">cake</span> ${age > 0 ? age + ' anos' : 'Menos de 1 ano'}`;
    }

    function saveChild() {
      const name = document.getElementById('modal-name').value.trim();
      if (!name) return;
      
      const badge = document.getElementById('modal-calc-age');
      const ageText = badge.innerText.trim();

      const grid = document.getElementById('profiles-grid');
      const addBtn = grid.lastElementChild;

      const newCard = document.createElement('div');
      newCard.className = "group bg-surface-container-lowest border-2 border-surface-container rounded-3xl p-6 flex flex-col items-center text-center shadow-sm hover:shadow-xl hover:border-primary-fixed transition-all duration-300 relative";
      newCard.innerHTML = `
        <div class="absolute top-4 right-4">
          <button aria-label="Opções ${name}" class="w-8 h-8 rounded-full hover:bg-surface-container flex items-center justify-center text-outline hover:text-on-surface transition-colors">
            <span class="material-symbols-outlined text-lg">edit</span>
          </button>
        </div>
        <div class="relative w-28 h-28 sm:w-32 sm:h-32 rounded-3xl overflow-hidden shadow-lg bg-surface-container-highest mb-4 group-hover:scale-105 transition-transform duration-300">
          <img class="w-full h-full object-cover" data-alt="Avatar de ${name}" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-0pIneDokJS6E_GCD_Lzwmws2ypLSygiRYaorUkkI_dPzPWrLN0MWmXKb3yxeV7gxCyDo5dH_S4GP6PHQapT6aBOUSADkU-0CBhSVa3IMSFAv9b_HNOVGgyhhCGrCqbPkavQwvAdGn_3bPEG6xvEhoW_hoUQ9OX1peYxgNrB8cuQZD0Tp6OQbUXdvhSICIWR5gskRuxCjUJggT6ZTRS7WOvKZHvxBH49qwnrKxZ-HYQ3kFSxi49RF2Q">
          <span class="absolute bottom-2 right-2 w-4 h-4 rounded-full bg-secondary ring-4 ring-surface-container-lowest"></span>
        </div>
        <h3 class="text-2xl font-bold text-on-surface">${name}</h3>
        <p class="text-sm font-semibold text-outline mt-0.5">${ageText}</p>
        <div class="mt-4 px-3.5 py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed text-xs font-bold flex items-center gap-1.5">
          <span class="material-symbols-outlined text-sm">check_circle</span>
          Perfil criado
        </div>
      `;

      grid.insertBefore(newCard, addBtn);
      toggleAddForm();
      document.getElementById('modal-name').value = '';
    }
  </script>
