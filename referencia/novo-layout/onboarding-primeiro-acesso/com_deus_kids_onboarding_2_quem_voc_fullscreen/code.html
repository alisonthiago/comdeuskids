<script>
    (function initInteractiveSelections() {
      // Alternância de Papel / Role
      const roleCards = document.querySelectorAll('.role-card');
      roleCards.forEach(card => {
        card.addEventListener('click', () => {
          roleCards.forEach(c => {
            c.classList.remove('active', 'border-primary-container', 'shadow-md', 'ring-2', 'ring-primary-container/20');
            c.classList.add('border-surface-container-high', 'text-on-surface-variant');
            const title = c.querySelector('span:last-child');
            if (title) {
              title.classList.remove('text-primary', 'font-bold');
              title.classList.add('font-semibold');
            }
          });

          card.classList.remove('border-surface-container-high', 'text-on-surface-variant');
          card.classList.add('active', 'border-primary-container', 'shadow-md', 'ring-2', 'ring-primary-container/20');
          const activeTitle = card.querySelector('span:last-child');
          if (activeTitle) {
            activeTitle.classList.remove('font-semibold');
            activeTitle.classList.add('text-primary', 'font-bold');
          }
        });
      });

      // Alternância de Avatar
      const avatarCards = document.querySelectorAll('.avatar-card');
      avatarCards.forEach(avatar => {
        avatar.addEventListener('click', () => {
          avatarCards.forEach(a => {
            a.classList.remove('active', 'border-primary-container', 'shadow-md', 'ring-2', 'ring-primary-container/20');
            a.classList.add('border-surface-container-high', 'shadow-sm');
            const indicator = a.querySelector('.badge-indicator');
            if (indicator) indicator.classList.add('hidden');
            const label = a.querySelector('span:last-child');
            if (label) {
              label.classList.remove('text-primary', 'font-semibold');
              label.classList.add('text-on-surface-variant', 'font-medium');
            }
          });

          avatar.classList.remove('border-surface-container-high', 'shadow-sm');
          avatar.classList.add('active', 'border-primary-container', 'shadow-md', 'ring-2', 'ring-primary-container/20');
          const activeIndicator = avatar.querySelector('.badge-indicator');
          if (activeIndicator) activeIndicator.classList.remove('hidden');
          const activeLabel = avatar.querySelector('span:last-child');
          if (activeLabel) {
            activeLabel.classList.remove('text-on-surface-variant', 'font-medium');
            activeLabel.classList.add('text-primary', 'font-semibold');
          }
        });
      });
    })();
  </script>
